[project]
name = "destiny-mcp"
version = "0.1.0"
description = "All-in-one Chinese metaphysics MCP: Bazi + Huangli. 命理综合MCP服务器"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
destiny-mcp = "destiny_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/destiny_mcp"]
